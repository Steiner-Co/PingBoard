name: Publish MCP

# Publishes @pingboard/mcp to npm when a tag like `mcp-v0.2.0` is pushed
# (or manually via the Actions tab). Requires an `NPM_TOKEN` repo secret
# (an npm "Automation" access token that can publish to the @pingboard scope).
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish @pingboard/mcp to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify MCP (typecheck, test, build)
        run: |
          bun run --filter @pingboard/mcp typecheck
          bun run --filter @pingboard/mcp test
          bun run --filter @pingboard/mcp build

      - name: Publish to npm
        run: npm publish --access public
        working-directory: apps/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
