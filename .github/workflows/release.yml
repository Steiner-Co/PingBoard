name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create GitHub Releases
  packages: write # push to GHCR

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the release notes can diff against the
          # previous tag.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PINGBOARD_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Release notes come from the commit log, not GitHub's built-in
      # generator: that one lists merged PRs, and this repo commits straight
      # to main, so the built-in notes would be empty.
      - name: Generate release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          image="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}"
          image=$(echo "$image" | tr '[:upper:]' '[:lower:]')
          {
            echo "## What's Changed"
            if [ -n "$prev" ]; then
              git log --pretty=format:'* %s' "$prev..${GITHUB_REF_NAME}"
              printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME"
            else
              git log --pretty=format:'* %s' "${GITHUB_REF_NAME}"
              printf '\n'
            fi
            printf '\n## Docker image\n```\ndocker pull %s\n```\n' "$image"
          } > release-notes.md

      # Runs only after the image pushed, so a release never points at an
      # image that failed to build.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
