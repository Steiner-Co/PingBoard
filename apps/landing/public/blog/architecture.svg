<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Diagram of PingBoard's single container: Bun server, scheduler and SQLite inside, dashboard, status pages and alerts outside">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#A1A1AA"/>
    </marker>
  </defs>
  <rect x="8" y="8" width="784" height="364" rx="24" fill="#FAFAF9" stroke="#E4E4E7" stroke-width="1.5"/>
  <text x="36" y="52" font-size="19" font-weight="650" fill="#18181B" letter-spacing="-0.3">One container</text>
  <text x="36" y="72" font-size="13" fill="#71717A" font-family="ui-monospace, monospace">pingboard:latest · port 3000 · /data</text>

  <rect x="36" y="92" width="728" height="128" rx="16" fill="none" stroke="#D4D4D8" stroke-width="1.5" stroke-dasharray="7 6"/>

  <g>
    <rect x="56" y="112" width="216" height="88" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
    <text x="164" y="142" font-size="15" font-weight="600" fill="#18181B" text-anchor="middle">Bun server</text>
    <text x="164" y="162" font-size="12.5" fill="#71717A" text-anchor="middle">REST API + SSE</text>
    <text x="164" y="180" font-size="12.5" fill="#71717A" text-anchor="middle">cookie sessions</text>
  </g>
  <g>
    <rect x="292" y="112" width="216" height="88" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
    <text x="400" y="142" font-size="15" font-weight="600" fill="#18181B" text-anchor="middle">Scheduler</text>
    <text x="400" y="162" font-size="12.5" fill="#71717A" text-anchor="middle">in-process timers</text>
    <text x="400" y="180" font-size="12.5" fill="#71717A" text-anchor="middle">no Redis, no queue</text>
  </g>
  <g>
    <rect x="528" y="112" width="216" height="88" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
    <text x="636" y="142" font-size="15" font-weight="600" fill="#18181B" text-anchor="middle">SQLite</text>
    <text x="636" y="162" font-size="12.5" fill="#71717A" text-anchor="middle">one file: pingboard.db</text>
    <text x="636" y="180" font-size="12.5" fill="#71717A" text-anchor="middle">backups = copy it</text>
  </g>

  <line x1="164" y1="220" x2="164" y2="256" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="220" x2="400" y2="256" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="636" y1="220" x2="636" y2="256" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="56" y="262" width="216" height="76" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="164" y="290" font-size="14" font-weight="600" fill="#15803D" text-anchor="middle">Dashboard</text>
    <text x="164" y="310" font-size="12.5" fill="#4D7C5F" text-anchor="middle">live over SSE</text>
  </g>
  <g>
    <rect x="292" y="262" width="216" height="76" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="400" y="290" font-size="14" font-weight="600" fill="#1D4ED8" text-anchor="middle">Status pages</text>
    <text x="400" y="310" font-size="12.5" fill="#5B7DB1" text-anchor="middle">N pages · /:slug</text>
  </g>
  <g>
    <rect x="528" y="262" width="216" height="76" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="636" y="290" font-size="14" font-weight="600" fill="#B45309" text-anchor="middle">Alerts</text>
    <text x="636" y="310" font-size="12.5" fill="#A07B3F" text-anchor="middle">email · webhook · chat</text>
  </g>
</svg>
